name: Build & Push Frontend

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/asterisk-consul/asterisksuite-frontend:latest
            ghcr.io/asterisk-consul/asterisksuite-frontend:dev
            ghcr.io/asterisk-consul/asterisksuite-frontend:dev-${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ secrets.NUXT_PUBLIC_API_BASE }}
            NUXT_API_BASE=${{ secrets.NUXT_API_BASE }}
